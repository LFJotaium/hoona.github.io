<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoona</title>
    <script type="text/javascript">
        // Global storage for the deep link path
        var customAppScheme = "yallahub://";

        window.onload = function() {
            // Parse the promo ID out of the current URL path dynamically
            var pathSegments = window.location.pathname.split('/');
            var promoId = pathSegments[pathSegments.length - 1];
            
            // Build the matching custom scheme path format
            if (promoId && promoId.trim() !== "" && promoId !== "promo") {
                customAppScheme = "yallahub://promo/" + promoId;
            } else {
                customAppScheme = "yallahub://home";
            }

            // Set the href of the action button dynamically
            document.getElementById("app-launch-btn").href = customAppScheme;
        };
    </script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        .logo {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .badge {
            display: inline-block;
            background-color: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 24px;
        }
        h2 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 12px 0;
            letter-spacing: -0.5px;
        }
        p {
            color: #a3a3a3;
            font-size: 16px;
            line-height: 1.5;
            margin: 0 0 32px 0;
        }
        .btn {
            display: block;
            background-color: #3b82f6;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .btn:active {
            background-color: #2563eb;
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Hoona</div>
        <div class="badge">Coming Soon</div>
        
        <h2>Official Release Pending</h2>
        <p>Please wait for the official release to access promotions and shared links directly on the web.</p>
        
        <a id="app-launch-btn" href="yallahub://" class="btn">
            Open in Hoona App
        </a>
    </div>
</body>
</html>
