<!DOCTYPE html>
<html>
<head>
    <script type="text/javascript">
        window.onload = function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            if (/android/i.test(userAgent)) {
                window.location.href = "https://play.google.com/store/apps/details?id=com.facebook.katana&hl=en&pli=1";
            }
        };
    </script>
</head>
<body>
    <h2 style="text-align:center; font-family: sans-serif; margin-top: 50px;">Redirecting...</h2>
</body>
</html>
